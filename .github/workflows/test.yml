# 每次推送 / 提 PR 时自动跑全部测试（全离线：不读 Outlook、不发信、不联网）
# Run the whole offline test suite on every push / pull request.
#
# 顺带做一件更值钱的事：**守卫检查**——如果哪天不小心把 .state / logs / config.json
# 这类带密钥和真实邮件的东西提交进来，CI 会当场变红拦住。
# It also guards against committing anything that holds secrets or real mail.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false          # 一个平台失败，其他平台继续跑完，方便一次看清问题
      matrix:
        # 这个工具本身就只支持 Windows（邮件收发走 Outlook COM），所以只跑 Windows。
        # 想额外验证「除桥接层外与平台无关」，把 ubuntu-latest 加回来即可（当前代码在两边都是绿的）。
        os: [windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 注意：YAML 里未加引号的值中出现「冒号+空格」会解析失败，所以这行用引号包起来
      - name: "守卫：仓库里不该出现的东西 / guard: nothing sensitive tracked"
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -Ei '(^|/)(\.state|logs|digests|runtime)/|(^|/)config\.json$|(^|/)secrets\.json$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::这些文件不该提交（含密钥或真实邮件）/ should not be committed:"
            echo "$bad"
            exit 1
          fi
          # 长得像真实密钥的字符串（20 位以上）；文档和测试里的 sk-xxxx 占位符不会命中
          key="$(git grep -nEI 'sk-[A-Za-z0-9_-]{20,}' -- . ':(exclude)*.md' ':(exclude)test/' || true)"
          if [ -n "$key" ]; then
            echo "::error::代码里疑似有 API 密钥 / possible API key committed:"
            echo "$key"
            exit 1
          fi
          echo "守卫通过 / guard passed"

      # 把输出同时存一份：失败时下面的步骤会把它转成「注解」，这样在 API / 网页上
      # 不用翻整段日志就能看到是哪条测试挂了。
      # tee 一份到文件；**必须 pipefail**，否则 tee 成功会把 node 的失败码吃掉。
      - name: 跑全部测试 / run the test suite
        shell: bash
        run: |
          set -o pipefail
          node test/run.mjs 2>&1 | tee "${RUNNER_TEMP}/test-output.txt"

      - name: "失败时把失败用例写成注解 / annotate the failing tests"
        if: failure()
        shell: bash
        run: |
          f="${RUNNER_TEMP}/test-output.txt"
          if [ ! -f "$f" ]; then
            echo "::error::测试没有产生输出（可能根本没跑起来）/ the suite produced no output"
            exit 0
          fi
          # Node 的 TAP 里，失败用例是 "not ok N - 名字"；再抓一下报告器打印的 ✖ 行
          grep -nE '^(not ok|# fail|# pass|✖)' "$f" | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=========== 最后 60 行 ==========="
          tail -60 "$f"
